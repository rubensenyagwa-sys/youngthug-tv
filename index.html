
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUNGTHUG TV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }
    header {
      background: #15151d;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo { color: #e50914; font-size: 25px; font-weight: bold; }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }
    .hero {
      padding: 55px 20px;
      text-align: center;
      background: linear-gradient(120deg, #350006, #15151d);
    }
    .hero h1 { font-size: 38px; margin-bottom: 10px; }
    .hero p { color: #ccc; }
    .search {
      margin-top: 20px;
      padding: 13px;
      width: min(90%, 400px);
      border: 0;
      border-radius: 7px;
    }
    main { padding: 25px 20px; }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .video {
      background: #191922;
      border-radius: 10px;
      overflow: hidden;
    }
    .thumbnail {
      height: 140px;
      background: #30303c;
      display: grid;
      place-items: center;
      color: #aaa;
      font-size: 40px;
    }
    .details { padding: 15px; }
    .details p { color: #aaa; font-size: 14px; }
    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      background: #15151d;
      margin-top: 35px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">YOUNGTHUG TV</div>
  <nav>
    <a href="#">Nyumbani</a>
    <a href="#">Video</a>
    <a href="#">Kuingia</a>
  </nav>
</header>

<section class="hero">
  <h1>Karibu YOUNGTHUG TV</h1>
  <p>Burudani yako, sehemu moja.</p>
  <input class="search" type="search" placeholder="Tafuta video...">
</section>

<main>
  <h2>Video Zetu</h2>
  <div class="videos">
    <div class="video">
      <div class="thumbnail">▶</div>
      <div class="details">
        <h3>Video ya Kwanza</h3>
        <p>Video itaonekana hapa baada ya kuongezwa.</p>
      </div>
    </div>
    <div class="video">
      <div class="thumbnail">▶</div>
      <div class="details">
        <h3>Video ya Pili</h3>
        <p>Burudani zaidi zinakuja.</p>
      </div>
    </div>
  </div>
</main>

<footer>
  © 2026 YOUNGTHUG TV. Haki zote zimehifadhiwa.
</footer>

</body>
  </html>
