
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUNGTHUG TV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      background: #171720;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo { color: #e50914; font-size: 23px; font-weight: bold; }
    main { max-width: 650px; margin: 35px auto; padding: 20px; }
    .welcome { text-align: center; margin-bottom: 30px; }
    .welcome h1 { font-size: 32px; }
    .welcome p { color: #aaa; }
    .panel {
      background: #191922;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 7px;
      background: #101018;
      color: white;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 7px;
      background: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #33333e; }
    #message { color: #ddd; line-height: 1.5; }
    footer { text-align: center; padding: 25px; color: #888; }
  </style>
</head>
<body>

<header>
  <div class="logo">YOUNGTHUG TV</div>
  <span>Burudani yako, sehemu moja.</span>
</header>

<main>
  <section class="welcome">
    <h1>Karibu YOUNGTHUG TV</h1>
    <p>Jisajili au ingia ili kuendelea.</p>
  </section>

  <section class="panel">
    <h2>Jisajili</h2>
    <input id="signupEmail" type="email" placeholder="Barua pepe">
    <input id="signupPassword" type="password" placeholder="Tengeneza password">
    <button id="signupBtn">JISAJILI</button>
  </section>

  <section class="panel">
    <h2>Ingia kwenye akaunti</h2>
    <input id="loginEmail" type="email" placeholder="Barua pepe">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">INGIA</button>
    <button id="logoutBtn" class="secondary" hidden>ONDOKA</button>
  </section>

  <p id="message">Tayari kuanza? Fungua akaunti yako.</p>
</main>

<footer>
  © 2026 YOUNGTHUG TV
</footer>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://winfasfsvcmnacjsqwfa.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_Sz-h0kUkDdk6rOzXLwWMPg_W7MWZTcU';

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const message = document.getElementById('message');
  const logoutBtn = document.getElementById('logoutBtn');

  document.getElementById('signupBtn').onclick = async () => {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    if (!email || !password) {
      message.textContent = 'Jaza barua pepe na password.';
      return;
    }

    const { error } = await supabase.auth.signUp({
      email,
      password
    });

    message.textContent = error
      ? error.message
      : 'Usajili umefanikiwa. Angalia barua pepe yako ikiwa uthibitisho unahitajika.';
  };

  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    message.textContent = error
      ? error.message
      : 'Umeingia kwenye akaunti yako! Karibu YOUNGTHUG TV.';

    if (!error) logoutBtn.hidden = false;
  };

  logoutBtn.onclick = async () => {
    const { error } = await supabase.auth.signOut();
    message.textContent = error ? error.message : 'Umetoka kwenye akaunti.';
    logoutBtn.hidden = true;
  };
</script>

</body>
</html>
